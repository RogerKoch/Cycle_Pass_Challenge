# data-model.yaml
# Strukturierte Ableitung aus docs/research/*.md — ersetzt die Volltexte NICHT,
# sondern macht die Kernparameter maschinenlesbar für backend/engine/*.

user_profile:
  age: int                     # z.B. 49
  height_cm: float             # z.B. 173
  # Gewicht/Körperfett/Muskelmasse NICHT hier — kommen aus checkins (zeitlich veränderlich)

checkins:
  frequency: weekly
  source: garmin_scale
  fields:
    - weight_kg
    - bodyfat_pct
    - muscle_kg
  derived:
    ffm_kg: "weight_kg * (1 - bodyfat_pct / 100)"   # fettfreie Masse

ftp_tests:
  frequency: "alle 6-8 Wochen"
  method: "Zwift Ramp Test"
  formula: "ftp_watts = 0.75 * best_1min_power"
  correction_note: "Ramp-Test überschätzt bei anaerob starken Fahrern tendenziell -> ggf. -3-5% manuell korrigieren"

# ---------------------------------------------------------------------------
# RAD-ZONEN (Coggan 7-Zonen-Modell, % von FTP)
# Quelle: docs/research/trainingsplan_ausdauer.md
# ---------------------------------------------------------------------------
cycling_zones:
  basis: ftp_watts
  zones:
    Z1_aktive_erholung:      { pct_ftp_max: 55 }
    Z2_grundlagenausdauer:   { pct_ftp_min: 55, pct_ftp_max: 75 }
    Z3_tempo:                { pct_ftp_min: 76, pct_ftp_max: 87 }
    sweet_spot:               { pct_ftp_min: 88, pct_ftp_max: 94 }
    Z4_schwelle:              { pct_ftp_min: 95, pct_ftp_max: 105 }
    Z5_vo2max:                { pct_ftp_min: 106, pct_ftp_max: 120 }
    Z6_Z7_anaerob:            { pct_ftp_min: 120 }

cycling_phases:
  - id: phase0_wiedereinstieg
    duration_weeks: [1, 2]
    volume_hours_week: 5
    focus: "Re-Adaptation, überwiegend Z2"
  - id: base
    duration_weeks: [1, 8]
    volume_hours_week: [5, 7]
    intensity_split: { easy_pct: 80 }
    key_sessions: ["sweet_spot_progression", "low_cadence_strength_intervals"]
  - id: build1
    duration_weeks: [9, 16]
    volume_hours_week: [6, 8]
    intensity_split: { easy_pct: 75 }
    key_sessions: ["schwelle_intervalle", "over_unders"]
  - id: build2
    duration_weeks: [17, 20]
    key_sessions: ["vo2max", "back_to_back_simulation"]
    kraft_frequency_per_week: 1   # reduziert von 2
  - id: peak_taper
    duration_weeks: [21, 28]
    key_sessions: ["pass_spezifisch", "back_to_back_wochenenden"]
    taper: { volume_reduction_pct: [40, 60], intensity: "halten" }
  - id: passsaison
    duration_months: 3
    maintenance: "1 Erhaltungsintervall/Woche, Kraft 1x"

# ---------------------------------------------------------------------------
# KRAFT-ENGINE
# Quelle: docs/research/kraftplan.md
# ---------------------------------------------------------------------------
strength_phases:
  - id: phase1_anatomische_anpassung
    duration_weeks: [1, 8]
    reps: [15, 25]
    sets: [2, 3]
    rest_seconds: [60, 90]
    equipment: "nur Körpergewicht"
    focus: ["McGill Big 3", "Glute-Aktivierung", "Liegestütz-Progression", "Inverted Rows", "Mobility"]
  - id: phase2_kraft_hypertrophie
    duration_weeks: [9, 16]
    reps: [8, 12]
    sets: 3
    rest_seconds: [60, 90]
    tempo_eccentric_seconds: [2, 3]
    equipment: "Körpergewicht + Widerstandsbänder ab hier"
    focus: ["Hollow Body", "Side Plank gestreckt", "Bulgarian Split Squat", "Single-Leg Deadlift"]
  - id: phase3_kraftausdauer_erhalt
    duration_weeks: [17, 24]
    reps: [10, 15]
    rest_seconds: [45, 60]
    focus: ["Copenhagen Plank", "anti-rotatorische Band-Holds", "Erhalt bei reduziertem Volumen"]
    reduction_rule: "bei intensiverer Rad-Saison auf 1-2 gering-ermüdende Einheiten reduzieren"

strength_constraints:
  sessions_per_week: 2          # reduziert auf 1 ab cycling_phase build2
  session_duration_minutes: [50, 55]
  min_hours_gap_to_hard_cycling_intervals: 6
  excluded_exercises: ["hochvolumige schwere Kniebeugen bis Versagen"]

# User-Vorgabe 2026-10-06 (Todo #1/#14): waehlbarer Kraft-Fokus, kommt obendrauf (+10 min/Einheit).
# Gruppen = Uebungsbibliothek A–D der Kraft-Recherche; Zusatzuebungen nur aus der Bibliothek.
strength_focus:
  options: [none, core, upper, legs, mobility]
  extra_sets_on_focus_group: 1
  extra_minutes_per_session: 10
  extras:                       # Zuordnung A/B = Annahme
    core:  { A: ["Plank"], B: ["Plank (Phase 1)", "Reverse Crunch/Leg Raises (ab Phase 2)"] }
    upper: { A: ["Scapular Push-ups"], B: ["Band Pull-Aparts + Face Pulls (Phase 1)"] }
    legs:  { A: ["Clamshells"], B: ["Step-ups"] }
    mobility: { routine: "+1 Satz je Drill, Pigeon fest" }
  core_focus_daily_mcgill: true   # Kraft-Recherche: Core profitiert von hoher Frequenz
  legs_paused_in: [peak_taper, passsaison, strength_reduced]   # "Beine schonen"

# Todo #5 (2026-10-07): Kraft-Benchmarks statt globalem Level. Quelle: Kraft-Recherche „Fortschrittsmessung“.
strength_benchmarks:
  interval_weeks: { default: 4, min: 2, max: 8 }   # Profilfeld, Erinnerung im Check-in-Review
  tests: [pushup_reps+variant, row_reps, side_plank_s+straight, sl_bridge_s, plank_s]
  stages:
    pushups: "ab 15 Wdh. -> naechste Variante (wand, inkline, knie, standard, fuesse_erhoeht, deficit)"   # 15 = Annahme
    rows: "ab 15 Wdh. -> Fuesse erhoeht"
    side_plank: "Knie ab 20 s -> gestreckt"
    glute_bridge: "SL-Halt ab 60 s -> einbeinig"
    core_advanced: "Plank >= 120 s und Side Plank gestreckt >= 30 s -> Hollow Body/Pallof vor ihrer Phase"
  milestones: { W8: "Standard-Liegestuetz", W12: ["SL Glute Bridge 60 s", "Side Plank gestreckt 30 s"], W16: "BSS 3x10", W20: "Plank 2 min", W24: "Re-Test" }

# ---------------------------------------------------------------------------
# ERNÄHRUNGS-ENGINE
# Quelle: docs/research/ernaehrungsplan.md
# ---------------------------------------------------------------------------
nutrition:
  bmr_formula: "10 * weight_kg + 6.25 * height_cm - 5 * age + 5"   # Mifflin-St Jeor

  maintenance_formula:
    non_exercise_factor: 1.45          # auf BMR (Büro, Wert aus der Recherche)
    activity_levels:                   # User-Vorgabe 2026-10-05: Profilfeld Alltag/Beruf, PAL ohne Sport (DGE)
      sitzend: 1.2
      buero: 1.45                      # Default
      gemischt: 1.65
      stehend: 1.85
      schwer: 2.1
    cycling_kcal_per_hour:             # MET-basiert (Ainsworth Compendium), @ 74kg Referenz
      leicht_rekom: 503                # 16-19 km/h
      moderat_base: 592                # 19-22 km/h
      zuegig_tempo: 740                # 22-26 km/h
      rennen_intervalle: 888           # 26-30+ km/h
      sehr_hart: 1169                  # >32 km/h
      note: "kcal/h skaliert mit aktuellem Körpergewicht, MET * kg"
    strength_kcal_per_session: 300

  deficit:
    active_phases: ["base", "build1"]
    inactive_phases: ["build2", "peak_taper", "passsaison"]
    kcal_per_day: [300, 400]
    max_weight_loss_pct_per_week: 0.7   # Warnschwelle -> Defizit verkleinern

  macros:
    protein:
      basis: "FFM bevorzugt (robuster über Gewichtsverlust-Phasen)"
      g_per_kg_bodyweight: [2.0, 2.2]
      g_per_kg_ffm: [2.3, 2.9]
      meal_distribution: "3 Hauptmahlzeiten x ~50-55g"
    fat:
      g_per_kg_bodyweight: [0.9, 1.0]
      min_pct_kcal: 20
    carbs:
      periodized_by_daytype:
        ruhetag:        { g_per_kg: 3, fat_g: 75 }
        moderater_tag:  { g_per_kg: 5, fat_g: 70 }
        langer_harter_tag: { g_per_kg: [6, 8], fat_g: 60 }

  intra_workout_fueling:
    - { duration_min_max: [0, 75],     carbs_g_per_hour: 0 }
    - { duration_min_max: [75, 150],   carbs_g_per_hour: [30, 60] }
    - { duration_min_max: [150, null], carbs_g_per_hour: [60, 90], ratio: "2:1 Glukose:Fruktose" }

  constraints:
    no_fish_seafood: true
    raw_cold_vegetables_preferred: true
    lunch: "kalt oder nur mikrowellengeeignet"
    no_intermittent_fasting: true

  recalibration_rule: "Makros neu berechnen alle ~4kg Gewichtsverlust oder bei jedem Check-in mit signifikanter FFM-Änderung"

# ---------------------------------------------------------------------------
# BASELINE-WERTE: FALLBACK-PATTERN (estimated -> measured)
# Quelle: zusätzliche Vorgaben des Users (nicht Teil von docs/research/*.md).
# Messwerte kommen aus dem Diagnostik-Termin (RMR, Körperzusammensetzung, Laktat/Spiro);
# bis dahin gelten Schätzwerte.
# ---------------------------------------------------------------------------
baseline_values:
  # Jedes Feld trägt zusätzlich: source: "estimated" | "measured" und updated_at.
  # measured-Felder sind NULL bis der Diagnostik-Termin erfolgt ist.
  fields:
    body_composition: [rmr_kcal, ffm_kg, bodyfat_pct, skinfold_sum_mm, phase_angle_deg]
    performance:      [vt1_hr, vt1_watts, vt2_hr, vt2_watts, fatmax_watts, fatmax_hr, mfo_g_min]
    targets:          [target_kcal, target_protein_g, target_carbs_g, target_fat_g]

  fallback_rule: "value = measured_value if measured_value is not None else estimated_value"

  # Umsetzung: nur Messwerte werden gespeichert (baseline_measurements). Schätzwerte werden bei
  # jedem Lesen live berechnet und veralten so nie; die Antwort liefert value/source/updated_at.
  estimated_from:
    rmr_kcal: "Mifflin-St Jeor: 10*kg + 6.25*cm - 5*age + 5"
    ffm_kg: "weight_kg * (1 - garmin_bodyfat_pct / 100)"     # = checkins.derived.ffm_kg
    bodyfat_pct: "letzter Check-in (Garmin-Waage)"
    target_bodyfat_pct: "16 (ergibt 68 kg bei ca. 57 kg FFM), überschreibbar"
    targets: "target_kcal/protein/carbs/fat = Engine-Berechnung (nutrition_calc) aus den Tagesparametern, nicht fixe Planwerte"
    vt1_hr_vt2_hr: "keine Schätzung implementiert; pauschale %HFmax-Formel bis Ramp-Test ist zurückgestellt (Prozentwerte/HFmax-Quelle offen)"

  # Ziele (target_*) sind nicht direkt überschreibbar: sie werden immer aus dem aufgelösten
  # RMR/FFM berechnet; source = measured, sobald RMR oder FFM gemessen sind.

  # Immer neu berechnet, nie gespeichert, nie manuell editierbar:
  derived:
    rmr_ratio: "rmr_kcal / (500 + 22 * ffm_kg)"
    target_weight_kg: "ffm_kg / (1 - target_bodyfat_pct / 100)"
    energy_availability: "(kcal_intake - training_kcal) / ffm_kg"   # Intake aus intake_days, training_kcal = Rad + Kraft des Tages

  trigger: "Entfällt als Code: derived-Felder werden bei jedem Lesen aus den aufgelösten Werten berechnet, ein neuer measured-Wert wirkt dadurch sofort."

# ---------------------------------------------------------------------------
# NAHRUNGSZUFUHR (Ist-Werte)
# ---------------------------------------------------------------------------
intake:
  granularity: "Einzeleinträge je Mahlzeit (fruehstueck/mittag/abend/snack/training) mit Nährwert-Snapshot; Schnelleinträge nur mit Summen"
  storage: "food_log_entries (Einträge), foods (BLV/OFF/eigene, pro 100 g, optionale Portion), meal_templates; intake_days = Tagessumme, wird bei jeder Log-Änderung neu berechnet"
  source: "Eigene Erfassung in der App (/ernaehrung/). Lebensmittel: Schweizer Nährwertdatenbank (BLV) + optional Barcode via Open Food Facts. PUT /api/intake/<datum> bleibt für manuelle Tagessummen, wird aber von Log-Einträgen überschrieben"
  energy_availability_scope: "heute im Tagesplan, Historie (Ø 7 Tage) im Check-in-Review; Trainings-kcal aus intervals.icu-Import (kJ), sonst Kalender"

# ---------------------------------------------------------------------------
# KOPPLUNGSREGELN ZWISCHEN ENGINES
# ---------------------------------------------------------------------------
sync_rules:
  phase_alignment:
    cycling_base: strength_phase1
    cycling_build1: strength_phase2
    cycling_build2: strength_phase3
    cycling_peak_taper: strength_phase3
  strength_session_gap_hours_to_hard_cycling: 6
  weekly_pattern_example:
    mo: { strength: "session_1", cycling: "ruhe_oder_z1" }
    di: { cycling: "schluessel_1_intervalle" }
    mi: { cycling: "z2_grundlage" }
    do: { strength: "session_2", cycling: "z2_grundlage_oder_rekom" }
    fr: { cycling: "ruhetag" }
    sa: { cycling: "schluessel_2_lange_ausfahrt" }
    so: { cycling: "lange_z2_oder_rekom" }

# ---------------------------------------------------------------------------
# CHECK-IN & TRIGGER-REGELN
# ---------------------------------------------------------------------------
# Vollständige Regeln und Quellen: docs/architecture.md → Check-in-Review; Umsetzung backend/engine/checkin_triggers.py.
# Massgeblich bleiben die Volltexte in docs/research/ (Abschnitte „Schwellen“, Ernährung §6, Kraft Signal-Monitoring).
checkin_triggers:
  weight_loss_too_fast: { condition: ">0.7%/week (2-Wochen-Trend)", action: "Defizit verkleinern (-100 kcal)" }
  weight_stagnation: { condition: "Trend >= 0 über >2–3 Wochen bei Defizit", action: "Defizit reduzieren" }
  diet_break_due: { condition: "Defizit 6–10 Wochen ohne Pause", action: "1–2 Wochen Erhaltung (umgesetzt: 7 Tage)" }
  target_weight_reached: { condition: "Gewicht <= Zielgewicht", action: "Erhaltung, Protein ~2,0 g/kg" }
  low_energy_availability: { condition: "EA < 30 kcal/kg FFM (Ø 7 Tage)", action: "mehr essen / Defizit verkleinern" }
  ftp_stagnation: { condition: "2 Retests in Folge ohne Fortschritt", action: "Volumen/Recovery prüfen" }
  ftp_declining: { condition: "FTP sinkt über zwei Tests", action: "Fettabbau stoppen/neu bewerten" }
  recovery_warning: { condition: "Ruhe-HF/HRV kippt mehrtägig ODER RPE steigt bei gleicher Watt ODER Schlaf leidet", action: "Erholungswoche/Deload sofort" }
  legs_flat: { condition: "Beine chronisch platt", action: "Kraftvolumen -20 %, Beinanteil reduzieren" }
  back_pain: { condition: "unterer Rücken schmerzt nach langen Fahrten", action: "Core-Frequenz erhöhen" }
  constant_hunger: { condition: "Dauerhunger", action: "Defizit reduzieren" }
  ftp_retests: { when: "alle 6–8 Wochen: Ende Base, Mitte Build, Ende Build 2, vor Peak", calendar: "Phase0 W1, Base W8, Build1 W6, Build2 W5 (Samstag)" }

# ---------------------------------------------------------------------------
# EVENT-VORBEREITUNG (Rennen/Touren zu beliebiger Zeit)
# ---------------------------------------------------------------------------
# Volltext und Quellen: docs/research/event-vorbereitung.md ([A] = App-Ableitung); Umsetzung backend/engine/event_prep.py.
events:
  priorities: { A: "Hauptevent", B: "wichtig", C: "Test" }
  kinds: [rennen, tour]
  taper_days: { A: 14, B: 7, C: 2 }
  taper_volume_factor: { A: [0.8, 0.5], B: [0.7, 0.55], C: [0.8, 0.8] }   # erster Tag -> T-2, linear
  load_days: 3
  loading_min_minutes: 90
  carbs_g_per_kg: { long_a_150min: { T-3: 7, T-2: 9, T-1: 10 }, medium: { T-2: 7, T-1: 8.5 }, short_or_c: { T-1: 7 } }
  load_fat_g_per_kg: 0.8
  deficit: { a_half_from_days: 14, ab_zero_from_days: 7, zero_in: [load, event, recovery] }
  recovery_days: { under_120min: 1, up_to_240min: 2, longer: 3 }
  weight_trend_excluded_window: "T-3 .. R+3"
