<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>Training</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="../ernaehrung/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="prev-day" class="icon-btn" aria-label="Vorheriger Tag">‹</button>
    <button id="date-label" class="date-label" aria-label="Zu heute springen"></button>
    <button id="next-day" class="icon-btn" aria-label="Nächster Tag">›</button>
  </header>

  <main>
    <p class="msg" id="page-msg"></p>
    <a id="review-banner" class="card banner" href="../#review" hidden></a>
    <div id="day"></div>

    <section class="card" id="week">
      <div class="meal-head">
        <h2>Woche</h2>
        <button id="swap-toggle">Tauschen</button>
      </div>
      <p class="hint" id="swap-hint" hidden>Zwei Tage antippen, um sie zu tauschen.</p>
      <ul id="week-list" class="list"></ul>
      <p class="msg" id="week-msg"></p>
      <button id="week-reset" class="danger">Woche auf Standard zurücksetzen</button>
    </section>

    <p class="footer"><a href="../ernaehrung/">Ernährung</a> · <a href="../">Dashboard</a> · <a href="../hilfe/">Erklärungen</a></p>
  </main>

  <!-- Einheit anpassen -->
  <dialog id="plan-dialog" class="sheet">
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="Schliessen">✕</button>
      <h2>Einheit anpassen</h2>
    </div>
    <form id="plan-form" class="grid">
      <label class="full">Rad<select name="cycling_slot" id="plan-slot"></select></label>
      <label class="full" id="plan-minutes-label">Dauer (min)<input name="planned_minutes" type="number" min="1" max="600" step="1" inputmode="numeric"></label>
      <label class="full">Kraft
        <select name="strength_session">
          <option value="">keine</option>
          <option value="A">Einheit A (Push/Core/Glute)</option>
          <option value="B">Einheit B (Pull/Core/Bein)</option>
        </select>
      </label>
      <button type="submit" class="primary full">Speichern</button>
    </form>
    <p class="msg" id="plan-msg"></p>
  </dialog>

  <!-- Rueckmeldung angepasst -->
  <dialog id="modified-dialog" class="sheet">
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="Schliessen">✕</button>
      <h2>Angepasst gefahren</h2>
    </div>
    <form id="modified-form" class="grid">
      <label>Minuten Rad<input name="actual_minutes" type="number" min="0" max="600" step="1" inputmode="numeric" required></label>
      <label>Intensität
        <select name="actual_intensity">
          <option value="leicht_rekom">leicht/Rekom</option>
          <option value="moderat_base">moderat/Base</option>
          <option value="zuegig_tempo">zügig/Tempo</option>
          <option value="rennen_intervalle">Intervalle</option>
          <option value="sehr_hart">sehr hart</option>
        </select>
      </label>
      <label class="full check"><input name="actual_strength_done" type="checkbox"> Krafteinheit gemacht</label>
      <button type="submit" class="primary full">Speichern</button>
    </form>
    <p class="msg" id="modified-msg"></p>
  </dialog>

  <!-- Absage -->
  <dialog id="cancel-dialog" class="sheet">
    <div class="sheet-head">
      <button class="icon-btn" data-close aria-label="Schliessen">✕</button>
      <h2>Training absagen</h2>
    </div>
    <form id="cancel-form" class="grid">
      <label class="full">Grund (optional)<input name="note" maxlength="200" placeholder="z.B. privater Anlass"></label>
      <button type="submit" class="primary full">Absagen</button>
    </form>
    <p class="msg" id="cancel-msg"></p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
