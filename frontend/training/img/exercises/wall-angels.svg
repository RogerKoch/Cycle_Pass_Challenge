<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 235" role="img" aria-label="Wall Angels: Start und Endposition, Ansicht von vorne">
<defs><style>
.b{stroke:#1d211c;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far{stroke:#a3a9a0}
