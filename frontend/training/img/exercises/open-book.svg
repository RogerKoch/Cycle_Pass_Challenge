<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 82 520 153" role="img" aria-label="Open Book: Start und Endposition, Ansicht vom Kopfende">
<defs><style>
.b{stroke:#1d211c;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far{stroke:#a3a9a0}
.hd{fill:#1d211c}
.fl{stroke:#c9cdc5;stroke-width:3}
.dv{stroke:#e1e4de;stroke-width:1.5;stroke-dasharray:4 5}
.ac{stroke:#2e7d32;stroke-width:3;stroke-dasharray:6 5;fill:none}
.acf{fill:#2e7d32;opacity:.35}
.acb{stroke:#2e7d32;stroke-width:5;stroke-linecap:round}
.ar{stroke:#c77700;stroke-width:3;fill:none;stroke-linecap:round}
.arh{fill:#c77700}
.bench{fill:#e1e4de;stroke:#a3a9a0;stroke-width:2}
text{font-family:system-ui,sans-serif;font-size:13px;fill:#646b62}
.vw{font-size:11px;font-style:italic}
.band{stroke:#a3a9a0;stroke-width:3;fill:none}
.pil{fill:#e1e4de}
.lb{font-weight:600;fill:#1d211c}
@media (prefers-color-scheme:dark){
.b{stroke:#e8ebe6}.far{stroke:#6f766c}.hd{fill:#e8ebe6}.fl{stroke:#4a4f48}.dv{stroke:#2f332e}
.ac,.acb{stroke:#7bc67e}.acf{fill:#7bc67e}.ar{stroke:#f0a640}.arh{fill:#f0a640}
.bench{fill:#2f332e;stroke:#6f766c}text{fill:#9aa197}.lb{fill:#e8ebe6}.band{stroke:#6f766c}.pil{fill:#2f332e}}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<line class="fl" x1="8" y1="200" x2="252" y2="200"/><line class="fl" x1="268" y1="200" x2="512" y2="200"/>
<line class="dv" x1="260" y1="90" x2="260" y2="215"/>
<text class="lb" x="12" y="100">Start</text><text class="lb" x="272" y="100">Ende</text>
<text class="vw" x="248" y="100" text-anchor="end">Ansicht vom Kopfende</text>
<!-- Start: Seitenlage, Arme vorne gestapelt -->
<circle class="b far" cx="218" cy="168" r="8"/><circle class="b far" cx="218" cy="190" r="8"/>
<rect class="pil" x="88" y="188" width="64" height="11" rx="4"/>
<line class="b" x1="120" y1="195" x2="200" y2="195"/>
<line class="b" x1="120" y1="195" x2="120" y2="150"/>
<line class="b" x1="120" y1="150" x2="198" y2="184"/>
<circle class="hd" cx="140" cy="176" r="12"/>
<path class="ar" d="M204 160 A85 85 0 0 0 42 160" marker-end="url(#ah)"/>
<text x="130" y="225" text-anchor="middle">Seitenlage, Hüfte/Knie 90°</text>
<g transform="translate(260 0)">
<!-- Ende: oberer Arm + Brustkorb aufgedreht -->
<ellipse class="ac" cx="218" cy="179" rx="18" ry="28"/>
<circle class="b far" cx="218" cy="168" r="8"/><circle class="b far" cx="218" cy="190" r="8"/>
<rect class="pil" x="88" y="188" width="64" height="11" rx="4"/>
<line class="b" x1="120" y1="195" x2="200" y2="195"/>
<line class="b" x1="120" y1="195" x2="81" y2="172"/>
<line class="b" x1="81" y1="172" x2="14" y2="192"/>
<circle class="hd" cx="140" cy="176" r="12"/>
<text x="130" y="225" text-anchor="middle">Blick folgt der Hand · Knie bleiben zusammen</text>
</g>
</svg>
