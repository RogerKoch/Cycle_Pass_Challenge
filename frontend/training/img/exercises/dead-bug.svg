<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 520 140" role="img" aria-label="Dead Bug: Start und Endposition">
<defs><style>
.b{stroke:#1d211c;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}
