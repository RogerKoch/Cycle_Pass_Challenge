<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 235" role="img" aria-label="Bulgarian Split Squat: Start und Endposition">
<defs><style>
.b{stroke:#1d211c;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far{stroke:#a3a9a0}
.hd{fill:#1d211c}
.fl{stroke:#c9cdc5;stroke-width:3}
.dv{stroke:#e1e4de;stroke-width:1.5;stroke-dasharray:4 5}
.ac{stroke:#2e7d32;stroke-width:3;stroke-dasharray:6 5;fill:none}
.acf{fill:#2e7d32;opacity:.35}
.acb{stroke:#2e7d32;stroke-width:5;stroke-linecap:round}
.ar{stroke:#c77700;stroke-width:3;fill:none;stroke-linecap:round}
.arh{fill:#c77700}
.bench{fill:#e1e4de;stroke:#a3a9a0;stroke-width:2}
text{font-family:system-ui,sans-serif;font-size:13px;fill:#646b62}
.lb{font-weight:600;fill:#1d211c}
@media (prefers-color-scheme:dark){
.b{stroke:#e8ebe6}.far{stroke:#6f766c}.hd{fill:#e8ebe6}.fl{stroke:#4a4f48}.dv{stroke:#2f332e}
.ac,.acb{stroke:#7bc67e}.acf{fill:#7bc67e}.ar{stroke:#f0a640}.arh{fill:#f0a640}
.bench{fill:#2f332e;stroke:#6f766c}text{fill:#9aa197}.lb{fill:#e8ebe6}}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<line class="fl" x1="8" y1="200" x2="252" y2="200"/><line class="fl" x1="268" y1="200" x2="512" y2="200"/><line class="dv" x1="260" y1="10" x2="260" y2="215"/>
<text class="lb" x="12" y="20">Start</text><text class="lb" x="272" y="20">Ende</text>
<!-- Start: aufrecht, hinterer Fuss auf Bank -->
<rect class="bench" x="28" y="158" width="58" height="42" rx="3"/>
<circle class="hd" cx="148" cy="40" r="11"/>
<polyline class="b far" points="140,115 115,154 72,152 56,157"/>
<line class="b" x1="140" y1="115" x2="144" y2="57"/>
<line class="b" x1="144" y1="57" x2="146" y2="112"/>
<polyline class="b" points="140,115 165,153 170,198 188,199"/>
<line class="acb" x1="143" y1="120" x2="162" y2="149"/>
<line class="ar" x1="215" y1="95" x2="215" y2="145" marker-end="url(#ah)"/>
<text x="130" y="225" text-anchor="middle">Grosser Schritt vor der Bank</text>
<g transform="translate(260 0)">
<!-- Ende: tiefe Position -->
<rect class="bench" x="28" y="158" width="58" height="42" rx="3"/>
<circle class="hd" cx="149" cy="79" r="11"/>
<polyline class="b far" points="135,155 102,186 72,152 56,157"/>
<line class="b" x1="135" y1="155" x2="145" y2="96"/>
<line class="b" x1="145" y1="96" x2="148" y2="151"/>
<polyline class="b" points="135,155 180,154 170,198 188,199"/>
<line class="acb" x1="140" y1="155" x2="175" y2="154"/>
<text x="130" y="225" text-anchor="middle">Knie über Fuss · Oberkörper aufrecht</text>
</g>
</svg>
