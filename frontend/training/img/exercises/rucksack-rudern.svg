<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 520 140" role="img" aria-label="Rucksack-Rudern vorgebeugt: Start und Ende, Ansicht von der Seite">
<defs><style>
.b{stroke:#1d211c;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far{stroke:#a3a9a0}
.hd{fill:#1d211c}
.fl{stroke:#c9cdc5;stroke-width:3}
.dv{stroke:#e1e4de;stroke-width:1.5;stroke-dasharray:4 5}
.ac{stroke:#2e7d32;stroke-width:3;stroke-dasharray:6 5;fill:none}
.acf{fill:#2e7d32;opacity:.35}
.acb{stroke:#2e7d32;stroke-width:5;stroke-linecap:round}
.ar{stroke:#c77700;stroke-width:3;fill:none;stroke-linecap:round}
.arh{fill:#c77700}
.bench{fill:#e1e4de;stroke:#a3a9a0;stroke-width:2}
text{font-family:system-ui,sans-serif;font-size:13px;fill:#646b62}
.vw{font-size:11px;font-style:italic}
.band{stroke:#a3a9a0;stroke-width:3;fill:none}
.pil{fill:#e1e4de}
.lb{font-weight:600;fill:#1d211c}
@media (prefers-color-scheme:dark){
.b{stroke:#e8ebe6}.far{stroke:#6f766c}.hd{fill:#e8ebe6}.fl{stroke:#4a4f48}.dv{stroke:#2f332e}
.ac,.acb{stroke:#7bc67e}.acf{fill:#7bc67e}.ar{stroke:#f0a640}.arh{fill:#f0a640}
.bench{fill:#2f332e;stroke:#6f766c}text{fill:#9aa197}.lb{fill:#e8ebe6}.band{stroke:#6f766c}.pil{fill:#2f332e}}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<line class="fl" x1="8" y1="200" x2="252" y2="200"/><line class="fl" x1="268" y1="200" x2="512" y2="200"/>
<line class="dv" x1="260" y1="103" x2="260" y2="215"/>
<text class="lb" x="12" y="113">Start</text><text class="lb" x="272" y="113">Ende</text>
<text class="vw" x="248" y="113" text-anchor="end">Ansicht von der Seite</text>
<polyline class="b" points="120,198 128,150"/>
<polyline class="b" points="128,150 80,128"/>
<circle class="hd" cx="62" cy="130" r="11"/>
<line class="b" x1="84" y1="130" x2="86" y2="172"/>
<rect class="bench" x="76" y="170" width="20" height="26" rx="3"/>
<ellipse class="acf" cx="96" cy="136" rx="14" ry="8"/>
<text x="130" y="225" text-anchor="middle">Rücken gerade, Arme hängen</text>
<g transform="translate(260 0)">
<polyline class="b" points="120,198 128,150"/>
<polyline class="b" points="128,150 80,128"/>
<circle class="hd" cx="62" cy="130" r="11"/>
<polyline class="b" points="84,130 112,140 90,152"/>
<rect class="bench" x="80" y="150" width="20" height="26" rx="3"/>
<ellipse class="acf" cx="96" cy="136" rx="14" ry="8"/>
<text x="130" y="225" text-anchor="middle">Ellbogen zur Hüfte ziehen</text>
</g>
</svg>
