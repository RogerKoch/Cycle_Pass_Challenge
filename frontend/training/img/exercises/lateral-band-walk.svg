<g transform="translate(260 0)">
<circle class="hd" cx="130" cy="61" r="12"/>
<line class="b" x1="130" y1="74" x2="130" y2="130"/>
<line class="b" x1="108" y1="84" x2="152" y2="84"/>
<polyline class="b" points="108,84 100,108 120,126"/><polyline class="b" points="152,84 160,108 140,126"/>
<line class="b" x1="115" y1="132" x2="145" y2="132"/>
