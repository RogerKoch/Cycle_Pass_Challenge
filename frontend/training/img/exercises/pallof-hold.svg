<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 82 520 153" role="img" aria-label="Pallof-Hold: Start und Endposition, Ansicht von oben">
<defs><style>
.b{stroke:#1d211c;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.far{stroke:#a3a9a0}
.hd{fill:#1d211c}
.fl{stroke:#c9cdc5;stroke-width:3}
.dv{stroke:#e1e4de;stroke-width:1.5;stroke-dasharray:4 5}
.ac{stroke:#2e7d32;stroke-width:3;stroke-dasharray:6 5;fill:none}
.acf{fill:#2e7d32;opacity:.35}
.acb{stroke:#2e7d32;stroke-width:5;stroke-linecap:round}
.ar{stroke:#c77700;stroke-width:3;fill:none;stroke-linecap:round}
.arh{fill:#c77700}
.bench{fill:#e1e4de;stroke:#a3a9a0;stroke-width:2}
text{font-family:system-ui,sans-serif;font-size:13px;fill:#646b62}
.vw{font-size:11px;font-style:italic}
.band{stroke:#a3a9a0;stroke-width:3;fill:none}
.pil{fill:#e1e4de}
.lb{font-weight:600;fill:#1d211c}
@media (prefers-color-scheme:dark){
.b{stroke:#e8ebe6}.far{stroke:#6f766c}.hd{fill:#e8ebe6}.fl{stroke:#4a4f48}.dv{stroke:#2f332e}
.ac,.acb{stroke:#7bc67e}.acf{fill:#7bc67e}.ar{stroke:#f0a640}.arh{fill:#f0a640}
.bench{fill:#2f332e;stroke:#6f766c}text{fill:#9aa197}.lb{fill:#e8ebe6}.band{stroke:#6f766c}.pil{fill:#2f332e}}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path class="arh" d="M0 0L10 5L0 10z"/></marker></defs>
<line class="dv" x1="260" y1="90" x2="260" y2="215"/>
<text class="lb" x="12" y="100">Start</text><text class="lb" x="272" y="100">Ende</text>
<text class="vw" x="248" y="100" text-anchor="end">Ansicht von oben</text>
<!-- Start: Haende an der Brust, Band seitlich -->
<rect class="bench" x="16" y="150" width="16" height="16" rx="2"/>
<line class="band" x1="32" y1="158" x2="150" y2="160"/>
<line class="b" x1="118" y1="128" x2="182" y2="128"/>
<polyline class="b" points="118,128 150,160 182,128"/>
<circle class="hd" cx="150" cy="126" r="15"/>
<line class="ar" x1="150" y1="172" x2="150" y2="205" marker-end="url(#ah)"/>
<text x="130" y="225" text-anchor="middle">Seitlich zum Band, Hände an der Brust</text>
<g transform="translate(260 0)">
<!-- Ende: Arme gestreckt, Rumpf haelt gegen -->
<line class="ac" x1="90" y1="128" x2="210" y2="128"/>
<rect class="bench" x="16" y="150" width="16" height="16" rx="2"/>
<line class="band" x1="32" y1="158" x2="150" y2="200"/>
<line class="b" x1="118" y1="128" x2="182" y2="128"/>
<polyline class="b" points="118,128 150,200 182,128"/>
<circle class="hd" cx="150" cy="126" r="15"/>
<line class="ar" x1="128" y1="176" x2="88" y2="162" marker-end="url(#ah)"/>
<text x="98" y="150" text-anchor="middle" class="vw">Zug</text>
<text x="130" y="225" text-anchor="middle">Arme strecken · Schultern bleiben gerade</text>
</g>
</svg>
